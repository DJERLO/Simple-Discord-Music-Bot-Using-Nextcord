server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
      enabled: true # Enable the new plugin's configuration
      allowSearch: true
      allowDirectVideoIds: true
      allowDirectPlaylistIds: true
      oauth:
        # Enables the OAuth integration
        enabled: true
        # The OAuth client ID
        # Leave commented the first time you run it to trigger the terminal link/code flow.
        # Once authenticated, paste the output refresh token here to skip future prompts.
        refreshToken: "${YOUTUBE_REFRESH_TOKEN}"

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false
      soundcloud: true
      scSearch: true
      local: false
      http: true # Crucial for streaming 24/7 direct audio/mp3 URLs
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO