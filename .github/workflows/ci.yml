name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    
    # Run three parallel test runners across your stated Python version tiers
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false # Don't cancel other versions if one experimental run fails

    steps:

    - name: Checkout Codebase
      uses: actions/checkout@v7

    - name: Install uv and Setup Python
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: latest

    - name: Install Dependencies
      run: uv sync --python ${{ matrix.python-version }}

    - name: Run Ruff Linter
      run: uv run ruff check .

    - name: Run Ruff Formatter Check
      run: uv run ruff format . --check

    - name: Run Unit Test Suite
      env:
        PYTHONPATH: .
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        LAVALINK_URI: ${{ secrets.LAVALINK_URI }}
        LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD }}
      run: uv run --python ${{ matrix.python-version }} pytest tests/ -v