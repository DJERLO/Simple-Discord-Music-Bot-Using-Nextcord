name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    
    # Run three parallel test runners across your stated Python version tiers
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14-dev"]
      fail-fast: false # Don't cancel other versions if one experimental run fails

    steps:

    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        
        # If the runner environment is Python 3.13 or 3.14-dev, pre-inject the LTS bridge
        if [[ "${{ matrix.python-version }}" == "3.13" || "${{ matrix.python-version }}" == "3.14-dev" ]]; then
          echo "Modern Python engine detected (${{ matrix.python-version }}). Pre-installing audioop-lts..."
          pip install audioop-lts
        fi
        
        pip install -r requirements.txt

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Ruff Formatter Check
      run: ruff format . --check

    - name: Run Unit Test Suite
      run: pytest test_bot.py -v