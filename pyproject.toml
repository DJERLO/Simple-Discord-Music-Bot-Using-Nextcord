[project]
name = "Simple-Discord-Music-Bot-Using-Nextcord"
version = "1.2.0"
description = "A Discord music bot built using Nextcord and Lavalink for asynchronous audio streaming via Wavelink."
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "nextcord[voice]>=3.2.0",
    "python-dotenv>=1.2.2",
    "wavelink>=3.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"

line-length = 88
lint.select = ["E", "F", "W", "I"]
lint.ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
override-dependencies = ["pynacl>=1.6.2"]